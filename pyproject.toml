[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "uv tabanli 6 haftalik AI Engineering uygulamali ogrenme workspace'i"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
